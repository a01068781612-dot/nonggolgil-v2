<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>*{margin:0;box-sizing:border-box}body{font-family:Pretendard;background:#fff}
.f{width:1220px;height:545px;display:flex;gap:6px;padding:6px;background:#fff;margin-bottom:20px;align-items:stretch}
.c{display:flex;flex-direction:column;gap:6px;min-width:0}
.im{flex:1;border:1.5px solid #d1d5db;border-radius:6px;background-size:cover;background-position:center;min-height:0}
.st{flex:1;display:flex;flex-direction:column;gap:4px;min-height:0}
.l{display:flex;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:700;letter-spacing:-.7px;white-space:nowrap;height:38px}
.l i{font-style:normal;background:#22c55e;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:16px}
.l.v i{background:#dc2626}.ar{display:flex;align-items:center;font-size:26px;color:#9ca3af;margin-bottom:44px}
.blank{flex:1;border:3px dashed #dc2626;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#dc2626;font-size:20px;font-weight:700;text-align:center;line-height:1.4;background:#fff7f7}
</style></head><body>
<!-- A: 책자 / GPTs / 웹앱 / 빈칸 -->
<div id="a" class="f">
 <div class="c" style="flex:.75"><div class="im" style="background-image:url(q_book.png);background-size:contain;background-repeat:no-repeat"></div><div class="l"><i>1</i>책자(2025)</div></div><div class="ar">›</div>
 <div class="c" style="flex:1.05"><div class="im" style="background-image:url(q_gpts2.png)"></div><div class="l"><i>2</i>AI 길라잡이(GPTs)</div></div><div class="ar">›</div>
 <div class="c" style="flex:1.05"><div class="im" style="background-image:url(q_web.png);background-position:left center"></div><div class="l"><i>3</i>AI 농골길 코치(웹앱)</div></div><div class="ar">›</div>
 <div class="c" style="flex:1.25"><div class="blank">농골길 V2 화면<br>(직접 캡처해 넣기)</div><div class="l v"><i>4</i>농골길 V2(본 출품작)</div></div>
</div>

 <div class="c" style="flex:1.25"><div class="blank">농골길 V2 화면<br>(직접 캡처해 넣기)</div><div class="l v"><i>4</i>농골길 V2(본 출품작)</div></div>
